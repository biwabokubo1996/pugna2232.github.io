<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>飞花令小游戏</title>
  <style>
    :root {
      --paper: #fbf7ef;
      --ink: #1f2424;
      --muted: #65706d;
      --line: rgba(31, 36, 36, .14);
      --red: #b6332f;
      --red-dark: #842321;
      --gold: #c99032;
      --green: #24685a;
      --blue: #305c8a;
      --panel: rgba(255, 252, 245, .86);
      --shadow: 0 18px 48px rgba(48, 36, 23, .14);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Noto Serif SC", "Songti SC", "SimSun", "Microsoft YaHei", serif;
      background:
        radial-gradient(circle at 20% 12%, rgba(201, 144, 50, .16), transparent 26rem),
        linear-gradient(115deg, #f8efe0, #fdfbf6 43%, #edf5f0);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(31, 36, 36, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(31, 36, 36, .026) 1px, transparent 1px);
      background-size: 26px 26px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.75), rgba(0,0,0,.12));
      z-index: 0;
    }

    #petals {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .shell {
      position: relative;
      z-index: 2;
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 28px;
    }

    header {
      min-height: 112px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 72px);
      line-height: .98;
      letter-spacing: 0;
      font-weight: 700;
    }

    .subtitle {
      margin: 12px 0 0;
      max-width: 680px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .seal {
      width: 88px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      color: #fff7ea;
      background: var(--red);
      box-shadow: inset 0 0 0 5px rgba(255,255,255,.22), var(--shadow);
      border-radius: 8px;
      font: 700 32px/1 "KaiTi", "STKaiti", serif;
      writing-mode: vertical-rl;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 18px;
      align-items: start;
    }

    .board, .side, .modal-card {
      background: var(--panel);
      border: 1px solid rgba(31, 36, 36, .12);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .board {
      min-height: 640px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }

    .field {
      display: grid;
      gap: 7px;
    }

    label {
      color: var(--muted);
      font-size: 13px;
    }

    .keyword-wrap {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input, select, textarea, button {
      font: inherit;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid rgba(31, 36, 36, .18);
      border-radius: 7px;
      background: rgba(255,255,255,.62);
      color: var(--ink);
      outline: none;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(36, 104, 90, .68);
      box-shadow: 0 0 0 3px rgba(36, 104, 90, .15);
      background: rgba(255,255,255,.9);
    }

    input, select { height: 42px; padding: 0 12px; }

    #keyword {
      width: 58px;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      color: var(--red-dark);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .chip {
      height: 30px;
      padding: 0 10px;
      border: 1px solid rgba(132, 35, 33, .18);
      border-radius: 999px;
      background: rgba(255,255,255,.58);
      color: var(--red-dark);
      cursor: pointer;
    }

    .chip.active {
      background: var(--red);
      color: white;
      border-color: transparent;
    }

    .btn {
      height: 42px;
      border: 0;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      background: var(--ink);
      color: white;
      cursor: pointer;
      white-space: nowrap;
      transition: transform .14s, filter .14s, opacity .14s;
    }

    .btn:hover { transform: translateY(-1px); filter: brightness(1.03); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .btn.primary { background: var(--red); }
    .btn.green { background: var(--green); }
    .btn.ghost {
      color: var(--ink);
      background: rgba(255,255,255,.62);
      border: 1px solid rgba(31,36,36,.15);
    }

    .icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .stage {
      position: relative;
      display: grid;
      grid-template-columns: 152px 1fr;
      gap: 18px;
      padding: 20px;
      min-height: 420px;
    }

    .time-ring {
      width: 152px;
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--red) var(--angle), rgba(31,36,36,.08) 0);
      transition: background .2s;
      align-self: start;
      position: sticky;
      top: 20px;
    }

    .time-ring::before {
      content: "";
      position: absolute;
      width: 122px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255,252,245,.96);
      box-shadow: inset 0 0 0 1px rgba(31,36,36,.12);
    }

    .time-text {
      position: relative;
      display: grid;
      place-items: center;
      gap: 2px;
    }

    #timeLeft {
      font-size: 42px;
      font-weight: 700;
      line-height: 1;
      color: var(--red-dark);
    }

    .time-label {
      font-size: 12px;
      color: var(--muted);
    }

    .poem-area {
      display: grid;
      grid-template-rows: auto auto minmax(132px, auto) auto;
      gap: 14px;
    }

    .prompt {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .prompt small { color: var(--muted); }

    .big-word {
      color: var(--red-dark);
      font-size: clamp(54px, 9vw, 112px);
      line-height: .9;
      font-weight: 700;
      text-shadow: 0 10px 28px rgba(132,35,33,.12);
    }

    .verse-card {
      min-height: 126px;
      display: grid;
      align-content: center;
      gap: 10px;
      padding: 18px;
      border-left: 4px solid var(--gold);
      background: rgba(255,255,255,.52);
      border-radius: 7px;
    }

    .verse-card .who {
      color: var(--muted);
      font-size: 14px;
    }

    .verse-card .line {
      font-size: clamp(23px, 4vw, 38px);
      line-height: 1.35;
      word-break: break-word;
    }

    .entry {
      display: grid;
      gap: 9px;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
      padding: 12px 14px;
      line-height: 1.7;
      font-size: 20px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .feedback {
      min-height: 28px;
      color: var(--muted);
      line-height: 1.6;
    }

    .feedback.good { color: var(--green); }
    .feedback.bad { color: var(--red-dark); }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,.4);
    }

    .stat {
      min-height: 78px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 4px;
      border-right: 1px solid var(--line);
    }

    .stat:last-child { border-right: 0; }
    .stat b { font-size: 27px; line-height: 1; }
    .stat span { color: var(--muted); font-size: 12px; }

    .side {
      display: grid;
      gap: 0;
      overflow: hidden;
    }

    .panel {
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .panel:last-child { border-bottom: 0; }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 18px;
      line-height: 1.2;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .mode {
      min-height: 62px;
      display: grid;
      gap: 4px;
      text-align: left;
      padding: 10px;
      border: 1px solid rgba(31,36,36,.14);
      background: rgba(255,255,255,.55);
      border-radius: 7px;
      cursor: pointer;
    }

    .mode strong { font-size: 15px; }
    .mode span { color: var(--muted); font-size: 12px; line-height: 1.35; }
    .mode.active { border-color: rgba(182,51,47,.5); box-shadow: 0 0 0 3px rgba(182,51,47,.1); }

    .history {
      display: grid;
      gap: 8px;
      max-height: 260px;
      overflow: auto;
      padding-right: 3px;
    }

    .history-item {
      display: grid;
      gap: 4px;
      padding: 10px;
      border-radius: 7px;
      background: rgba(255,255,255,.58);
      border: 1px solid rgba(31,36,36,.1);
    }

    .history-item .meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .history-item p {
      margin: 0;
      line-height: 1.55;
      word-break: break-word;
    }

    .hint-list {
      display: grid;
      gap: 8px;
    }

    .hint {
      border: 1px dashed rgba(48, 92, 138, .35);
      color: var(--blue);
      background: rgba(48, 92, 138, .06);
      border-radius: 7px;
      padding: 10px;
      line-height: 1.5;
      min-height: 44px;
    }

    .empty {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(31, 36, 36, .34);
    }

    .modal.open { display: grid; }

    .modal-card {
      width: min(520px, 100%);
      padding: 24px;
    }

    .modal-card h2 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    .modal-card p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.7;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .result-grid div {
      border-radius: 7px;
      background: rgba(255,255,255,.58);
      padding: 12px;
      text-align: center;
      border: 1px solid rgba(31,36,36,.1);
    }

    .result-grid b {
      display: block;
      font-size: 26px;
    }

    .result-grid span {
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 900px) {
      header { grid-template-columns: 1fr; }
      .seal { display: none; }
      main { grid-template-columns: 1fr; }
      .side { order: -1; }
      .stage { grid-template-columns: 1fr; }
      .time-ring {
        position: relative;
        top: auto;
        width: 116px;
      }
      .time-ring::before { width: 92px; }
      #timeLeft { font-size: 32px; }
    }

    @media (max-width: 620px) {
      .shell {
        width: min(100% - 20px, 1180px);
        padding-top: 14px;
      }
      header { min-height: auto; gap: 8px; }
      .subtitle { font-size: 14px; }
      .toolbar { grid-template-columns: 1fr; }
      .mode-grid, .stats, .result-grid { grid-template-columns: repeat(2, 1fr); }
      .stage { padding: 14px; }
      .actions .btn { flex: 1 1 132px; }
      .stat { min-height: 66px; }
      textarea { font-size: 18px; }
    }
  </style>
</head>
<body>
  <canvas id="petals" aria-hidden="true"></canvas>

  <div class="shell">
    <header>
      <div>
        <h1>飞花令</h1>
        <p class="subtitle">选一个令字，轮流吟出含有令字的诗句。答得越快分越高，内置题库命中可得满分，也可以用自记诗句闯关。</p>
      </div>
      <div class="seal" aria-hidden="true">雅集</div>
    </header>

    <main>
      <section class="board" aria-label="游戏区">
        <div class="toolbar">
          <div class="field">
            <label for="keyword">令字</label>
            <div class="keyword-wrap">
              <input id="keyword" maxlength="1" value="花" aria-label="当前令字">
              <div class="chips" id="chips" aria-label="常用令字"></div>
            </div>
          </div>
          <div class="field">
            <label for="roundTime">每回合</label>
            <select id="roundTime">
              <option value="20">20 秒</option>
              <option value="30" selected>30 秒</option>
              <option value="45">45 秒</option>
              <option value="60">60 秒</option>
            </select>
          </div>
          <button class="btn primary" id="startBtn" type="button" title="开始新局">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 9-14 9V3z"></path></svg>
            <span id="startLabel">开始</span>
          </button>
        </div>

        <div class="stage">
          <div class="time-ring" id="timeRing" style="--angle: 360deg">
            <div class="time-text">
              <div id="timeLeft">30</div>
              <div class="time-label">秒</div>
            </div>
          </div>

          <div class="poem-area">
            <div class="prompt">
              <div class="big-word" id="promptWord">花</div>
              <small id="turnLabel">点“开始”开局</small>
            </div>

            <div class="verse-card" aria-live="polite">
              <div class="who" id="lastWho">上一句</div>
              <div class="line" id="lastLine">春眠不觉晓，处处闻啼鸟。</div>
            </div>

            <div class="entry">
              <label for="answer">你的诗句</label>
              <textarea id="answer" placeholder="例如：花间一壶酒，独酌无相亲。" disabled></textarea>
            </div>

            <div class="actions">
              <button class="btn green" id="submitBtn" type="button" disabled title="提交诗句">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
                提交
              </button>
              <button class="btn ghost" id="hintBtn" type="button" disabled title="获得提示">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M8.2 14.8a6 6 0 1 1 7.6 0c-.9.7-.8 1.7-.8 1.7H9s.1-1-.8-1.7z"></path></svg>
                提示
              </button>
              <button class="btn ghost" id="skipBtn" type="button" disabled title="跳过本回合">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4l10 8-10 8V4z"></path><path d="M19 5v14"></path></svg>
                跳过
              </button>
            </div>
            <div class="feedback" id="feedback">准备好后，选择令字开始。</div>
          </div>
        </div>

        <div class="stats">
          <div class="stat"><b id="score">0</b><span id="scoreLabel">总分</span></div>
          <div class="stat"><b id="combo">0</b><span>连中</span></div>
          <div class="stat"><b id="lives">3</b><span>机会</span></div>
          <div class="stat"><b id="round">0</b><span>回合</span></div>
        </div>
      </section>

      <aside class="side" aria-label="辅助信息">
        <div class="panel">
          <h2>模式</h2>
          <div class="mode-grid">
            <button class="mode active" type="button" data-mode="solo">
              <strong>独酌</strong>
              <span>只考你，答对进入下一回合。</span>
            </button>
            <button class="mode" type="button" data-mode="duel">
              <strong>双人</strong>
              <span>玩家甲、玩家乙轮流接令。</span>
            </button>
          </div>
        </div>

        <div class="panel">
          <h2>提示</h2>
          <div class="hint-list" id="hintList">
            <div class="empty">开局后可消耗少量分数查看提示。</div>
          </div>
        </div>

        <div class="panel">
          <h2>本局记录</h2>
          <div class="history" id="history">
            <div class="empty">还没有记录。</div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <h2 id="modalTitle">曲终</h2>
      <p id="modalText">本局结束。</p>
      <div class="result-grid">
        <div><b id="finalScore">0</b><span>得分</span></div>
        <div><b id="finalRound">0</b><span>回合</span></div>
        <div><b id="finalCombo">0</b><span id="finalComboLabel">最高连中</span></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="againBtn" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 3v7h-7"></path></svg>
          再来一局
        </button>
        <button class="btn ghost" id="closeModalBtn" type="button">查看记录</button>
      </div>
    </div>
  </div>

  <script>
    const poemBank = [
      ["花", "花间一壶酒，独酌无相亲。", "李白《月下独酌》"],
      ["花", "夜来风雨声，花落知多少。", "孟浩然《春晓》"],
      ["花", "感时花溅泪，恨别鸟惊心。", "杜甫《春望》"],
      ["花", "待到重阳日，还来就菊花。", "孟浩然《过故人庄》"],
      ["花", "停车坐爱枫林晚，霜叶红于二月花。", "杜牧《山行》"],
      ["花", "春花秋月何时了，往事知多少。", "李煜《虞美人》"],
      ["花", "黄四娘家花满蹊，千朵万朵压枝低。", "杜甫《江畔独步寻花》"],
      ["花", "桃花潭水深千尺，不及汪伦送我情。", "李白《赠汪伦》"],
      ["花", "竹外桃花三两枝，春江水暖鸭先知。", "苏轼《惠崇春江晚景》"],
      ["花", "无可奈何花落去，似曾相识燕归来。", "晏殊《浣溪沙》"],
      ["月", "举头望明月，低头思故乡。", "李白《静夜思》"],
      ["月", "明月几时有，把酒问青天。", "苏轼《水调歌头》"],
      ["月", "春风又绿江南岸，明月何时照我还。", "王安石《泊船瓜洲》"],
      ["月", "海上生明月，天涯共此时。", "张九龄《望月怀远》"],
      ["月", "秦时明月汉时关，万里长征人未还。", "王昌龄《出塞》"],
      ["月", "露从今夜白，月是故乡明。", "杜甫《月夜忆舍弟》"],
      ["月", "深林人不知，明月来相照。", "王维《竹里馆》"],
      ["月", "月落乌啼霜满天，江枫渔火对愁眠。", "张继《枫桥夜泊》"],
      ["酒", "劝君更尽一杯酒，西出阳关无故人。", "王维《送元二使安西》"],
      ["酒", "葡萄美酒夜光杯，欲饮琵琶马上催。", "王翰《凉州词》"],
      ["酒", "借问酒家何处有，牧童遥指杏花村。", "杜牧《清明》"],
      ["酒", "白日放歌须纵酒，青春作伴好还乡。", "杜甫《闻官军收河南河北》"],
      ["酒", "花间一壶酒，独酌无相亲。", "李白《月下独酌》"],

    const els = {
      keyword: document.querySelector("#keyword"),
      chips: document.querySelector("#chips"),
      roundTime: document.querySelector("#roundTime"),
      startBtn: document.querySelector("#startBtn"),
      startLabel: document.querySelector("#startLabel"),
      submitBtn: document.querySelector("#submitBtn"),
      hintBtn: document.querySelector("#hintBtn"),
      skipBtn: document.querySelector("#skipBtn"),
      answer: document.querySelector("#answer"),
      promptWord: document.querySelector("#promptWord"),
      turnLabel: document.querySelector("#turnLabel"),
      lastWho: document.querySelector("#lastWho"),
      lastLine: document.querySelector("#lastLine"),
      feedback: document.querySelector("#feedback"),
      timeLeft: document.querySelector("#timeLeft"),
      timeRing: document.querySelector("#timeRing"),
      score: document.querySelector("#score"),
      scoreLabel: document.querySelector("#scoreLabel"),
      combo: document.querySelector("#combo"),

      round: document.querySelector("#round"),
      history: document.querySelector("#history"),

      modalText: document.querySelector("#modalText"),

      finalCombo: document.querySelector("#finalCombo"),

    const popularWords = ["花", "月", "酒", "风", "山", "水", "夜", "雨", "雪", "云", "日", "春", "秋", "江", "楼", "人", "归", "心", "青", "红", "白", "天", "梦"];
    const normalize = text => text.replace(/[，。！？；：、,.!?;:\s《》“”"']/g, "");

    let state = {
      mode: "solo",
      running: false,
      keyword: "花",
      score: 0,
      combo: 0,
      bestCombo: 0,
      lives: 3,
      activePlayer: 0,
      players: [
        { name: "玩家甲", score: 0, lives: 3 },
        { name: "玩家乙", score: 0, lives: 3 }
      ],
      round: 0,
      timeLimit: 30,
      timeLeft: 30,
      timer: null,
      used: new Set(),
      history: [],
      hintCount: 0
    };
    let pendingTimers = [];

    function poemsFor(word) {
      return poemBank.filter(([key, line]) => key === word || line.includes(word));
    }

    function setFeedback(text, type = "") {
      els.feedback.textContent = text;
      els.feedback.className = `feedback ${type}`;
    }

    function later(callback, delay) {
      const id = setTimeout(() => {
        pendingTimers = pendingTimers.filter(item => item !== id);
        callback();
      }, delay);
      pendingTimers.push(id);
    }

    function clearPendingTimers() {
      pendingTimers.forEach(id => clearTimeout(id));
      pendingTimers = [];
    }

    function drawChips() {
      els.chips.innerHTML = "";
      popularWords.forEach(word => {
        const button = document.createElement("button");
        button.className = `chip${word === state.keyword ? " active" : ""}`;
        button.type = "button";
        button.textContent = word;
        button.addEventListener("click", () => {
          if (state.running) return;
          state.keyword = word;
          els.keyword.value = word;
          els.promptWord.textContent = word;
          drawChips();
          renderHints(true);
        });
        els.chips.appendChild(button);
      });
    }

    function renderStats() {
      if (state.mode === "duel") {
        els.score.textContent = state.players[0].score;
        els.scoreLabel.textContent = "玩家甲";
        els.combo.textContent = state.players[1].score;
        els.combo.nextElementSibling.textContent = "玩家乙";
        els.lives.textContent = `${state.players[0].lives}/${state.players[1].lives}`;
      } else {
        els.score.textContent = state.score;
        els.scoreLabel.textContent = "总分";
        els.combo.textContent = state.combo;
        els.combo.nextElementSibling.textContent = "连中";
        els.lives.textContent = state.lives;
      }
      els.round.textContent = state.round;
    }

    function renderHistory() {
      if (!state.history.length) {
        els.history.innerHTML = `<div class="empty">还没有记录。</div>`;
        return;
      }
      els.history.innerHTML = state.history.slice().reverse().map(item => `
        <div class="history-item">
          <div class="meta"><span>${item.who}</span><span>${item.points > 0 ? "+" + item.points : item.points}</span></div>
          <p>${escapeHtml(item.line)}</p>
        </div>
      `).join("");
    }

    function renderHints(preview = false) {
      const choices = poemsFor(state.keyword).filter(([, line]) => !state.used.has(normalize(line)));
      if (!choices.length) {
        els.hintList.innerHTML = `<div class="empty">这个令字的内置提示已经用完，可以换一个令字再开局。</div>`;
        return;
      }
      if (preview || !state.running) {
        els.hintList.innerHTML = choices.slice(0, 3).map(([key, line, source]) => `
          <div class="hint">${maskLine(line, state.keyword)}<br><small>${source}</small></div>
        `).join("");
      }
    }

    function maskLine(line, word) {
      const masked = line.replaceAll(word, `<strong>${word}</strong>`);
      return masked.replace(/[\u4e00-\u9fa5]/g, char => char === word ? char : "□");
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function setControls(active) {
      els.answer.disabled = !active;
      els.submitBtn.disabled = !active;
      els.hintBtn.disabled = !active;
      els.skipBtn.disabled = !active;
      els.keyword.disabled = active;
      els.roundTime.disabled = active;
      els.startLabel.textContent = active ? "重开" : "开始";
    }

    function startGame() {
      stopTimer();
      clearPendingTimers();
      const keyword = els.keyword.value.trim().slice(0, 1) || "花";
      state = {
        ...state,
        running: true,
        keyword,
        score: 0,
        combo: 0,
        bestCombo: 0,
        lives: 3,
        activePlayer: 0,
        players: [
          { name: "玩家甲", score: 0, lives: 3 },
          { name: "玩家乙", score: 0, lives: 3 }
        ],
        round: 0,
        timeLimit: Number(els.roundTime.value),
        timeLeft: Number(els.roundTime.value),
        used: new Set(),
        history: [],
        hintCount: 0
      };
      els.keyword.value = keyword;
      els.promptWord.textContent = keyword;
      els.lastWho.textContent = "令官";
      els.lastLine.textContent = `请吟一句含“${keyword}”的诗。`;
      els.answer.value = "";
      els.modal.classList.remove("open");
      setControls(true);
      drawChips();
      renderStats();
      renderHistory();
      renderHints();
      nextRound(currentPlayer().name);
      els.answer.focus();
    }

    function currentPlayer() {
      return state.mode === "duel" ? state.players[state.activePlayer] : { name: "你" };
    }

    function switchPlayer() {
      if (state.mode === "duel") state.activePlayer = state.activePlayer === 0 ? 1 : 0;
    }

    function nextRound(label) {
      state.round += 1;
      state.timeLeft = state.timeLimit;
      state.hintCount = 0;
      els.turnLabel.textContent = `${label} · 第 ${state.round} 回合`;
      els.answer.value = "";
      setFeedback(`${label}，请说出一句含“${state.keyword}”的诗句。`);
      renderStats();
      renderClock();
      startTimer();
    }

    function startTimer() {
      stopTimer();
      state.timer = setInterval(() => {
        state.timeLeft -= 1;
        renderClock();
        if (state.timeLeft <= 0) miss("超时未答，失去一次机会。");
      }, 1000);
    }

    function stopTimer() {
      if (state.timer) clearInterval(state.timer);
      state.timer = null;
    }

    function renderClock() {
      els.timeLeft.textContent = Math.max(0, state.timeLeft);
      const angle = Math.max(0, state.timeLeft / state.timeLimit) * 360;
      els.timeRing.style.setProperty("--angle", `${angle}deg`);
    }

    function evaluateAnswer() {
      if (!state.running) return;
      const raw = els.answer.value.trim();
      if (!raw) {
        setFeedback("先写一句诗，再提交。", "bad");
        return;
      }
      const line = raw.replace(/\s+/g, "");
      const normalized = normalize(line);
      if (!line.includes(state.keyword)) {
        setFeedback(`这句里没有“${state.keyword}”。`, "bad");
        return;
      }
      if (state.used.has(normalized)) {
        setFeedback("这句已经用过了。", "bad");
        return;
      }

      const exact = poemBank.find(([, poemLine]) => normalize(poemLine) === normalized);
      const partial = poemBank.find(([, poemLine]) => normalize(poemLine).includes(normalized) || normalized.includes(normalize(poemLine)));
      const known = exact || partial;
      const speedBonus = Math.ceil(state.timeLeft / 5);
      const base = known ? 10 : 5;
      const points = Math.max(1, base + speedBonus - state.hintCount * 2);
      const player = currentPlayer();
      if (state.mode === "duel") {
        player.score += points;
      } else {
        state.score += points;
      }
      state.combo += 1;
      state.bestCombo = Math.max(state.bestCombo, state.combo);
      state.used.add(normalized);
      addHistory(player.name, line, points);
      els.lastWho.textContent = known ? `${player.name} · ${known[2]}` : `${player.name} · 自记诗句`;
      els.lastLine.textContent = line;
      setFeedback(known ? `${player.name} 命中题库，得 ${points} 分。` : `${player.name} 含令字，得 ${points} 分。`, "good");

      stopTimer();
      renderStats();
      renderHistory();
      renderHints();

      switchPlayer();
      later(() => nextRound(currentPlayer().name), 620);
    }

    function addHistory(who, line, points) {
      state.history.push({ who, line, points });
    }

    function showHint() {
      if (!state.running) return;
      const candidates = poemsFor(state.keyword).filter(([, line]) => !state.used.has(normalize(line)));
      if (!candidates.length) {
        setFeedback("这个令字暂无更多提示。", "bad");
        return;
      }
      state.hintCount += 1;
      const sample = candidates.slice(0, 3);
      els.hintList.innerHTML = sample.map(([, line, source], index) => {
        const revealCount = Math.min(line.length, 2 + state.hintCount + index);
        let seen = 0;
        const text = line.replace(/[\u4e00-\u9fa5]/g, char => {
          seen += 1;
          return char === state.keyword || seen <= revealCount ? char : "□";
        });
        return `<div class="hint">${text}<br><small>${source}</small></div>`;
      }).join("");
      setFeedback("已给出提示，本回合得分会略降。");
    }

    function miss(reason) {
      stopTimer();
      const player = currentPlayer();
      if (state.mode === "duel") {
        player.lives -= 1;
      } else {
        state.lives -= 1;
      }
      state.combo = 0;
      addHistory(`${player.name}失误`, reason, -1);
      setFeedback(`${player.name}：${reason}`, "bad");
      renderStats();
      renderHistory();
      if (state.mode === "duel" && player.lives <= 0) {
        endGame(`${player.name} 三次机会用尽。`);
      } else if (state.mode === "solo" && state.lives <= 0) {
        endGame("三次机会用尽，本局结束。");
      } else {
        switchPlayer();
        later(() => nextRound(currentPlayer().name), 760);
      }
    }

    function endGame(text) {
      stopTimer();
      clearPendingTimers();
      state.running = false;
      setControls(false);
      const winner = state.mode === "duel" ? getWinner() : null;
      els.finalScore.textContent = state.mode === "duel" ? `${state.players[0].score}:${state.players[1].score}` : state.score;
      els.finalRound.textContent = state.round;
      els.finalComboLabel.textContent = state.mode === "duel" ? "胜者" : "最高连中";
      els.finalCombo.textContent = winner || state.bestCombo;
      els.modalText.textContent = state.mode === "duel" ? `${text} 甲 ${state.players[0].score} 分，乙 ${state.players[1].score} 分。` : text;
      els.modal.classList.add("open");
      renderStats();
    }

    function getWinner() {
      const [a, b] = state.players;
      if (a.score > b.score) return "玩家甲";
      if (b.score > a.score) return "玩家乙";
      return "平局";
    }

    function initEvents() {
      els.startBtn.addEventListener("click", startGame);
      els.againBtn.addEventListener("click", startGame);
      els.closeModalBtn.addEventListener("click", () => els.modal.classList.remove("open"));
      els.submitBtn.addEventListener("click", evaluateAnswer);
      els.hintBtn.addEventListener("click", showHint);
      els.skipBtn.addEventListener("click", () => miss("主动跳过，失去一次机会。"));
      els.answer.addEventListener("keydown", event => {
        if ((event.ctrlKey || event.metaKey) && event.key === "Enter") evaluateAnswer();
      });
      els.keyword.addEventListener("input", () => {
        const word = els.keyword.value.trim().slice(0, 1) || "花";
        state.keyword = word;
        els.keyword.value = word;
        els.promptWord.textContent = word;
        drawChips();
        renderHints(true);
      });
      els.modes.forEach(button => {
        button.addEventListener("click", () => {
          if (state.running) return;
          state.mode = button.dataset.mode;
          els.modes.forEach(item => item.classList.toggle("active", item === button));
          renderStats();
        });
      });
    }

    function initPetals() {
      const canvas = document.querySelector("#petals");
      const ctx = canvas.getContext("2d");
      let width = 0;
      let height = 0;
      let petals = [];

      function resize() {
        width = canvas.width = window.innerWidth * devicePixelRatio;
        height = canvas.height = window.innerHeight * devicePixelRatio;
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;
        petals = Array.from({ length: Math.min(44, Math.floor(window.innerWidth / 22)) }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          r: (3 + Math.random() * 7) * devicePixelRatio,
          speed: (.25 + Math.random() * .75) * devicePixelRatio,
          drift: (-.35 + Math.random() * .7) * devicePixelRatio,
          turn: Math.random() * Math.PI * 2,
          hue: Math.random() > .35 ? "rgba(182,51,47,.22)" : "rgba(201,144,50,.18)"
        }));
      }

      function frame() {
        ctx.clearRect(0, 0, width, height);
        petals.forEach(petal => {
          petal.turn += .018;
          petal.x += petal.drift + Math.sin(petal.turn) * .35 * devicePixelRatio;
          petal.y += petal.speed;
          if (petal.y > height + 20) {
            petal.y = -20;
            petal.x = Math.random() * width;
          }
          ctx.save();
          ctx.translate(petal.x, petal.y);
          ctx.rotate(petal.turn);
          ctx.fillStyle = petal.hue;
          ctx.beginPath();
          ctx.ellipse(0, 0, petal.r * 1.35, petal.r * .55, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
        requestAnimationFrame(frame);
      }

      window.addEventListener("resize", resize);
      resize();
      frame();
    }

    drawChips();
    renderStats();
    renderHints(true);
    initEvents();
    initPetals();
  </script>
</body>
</html>
